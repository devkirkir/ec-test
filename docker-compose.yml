services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/app.sqlite
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    volumes:
      - db-data:/app/data
    stop_grace_period: 12s
    restart: unless-stopped

volumes:
  db-data:
